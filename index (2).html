<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060d">
<meta name="description" content="เกมหนีห้องศิลปะ 21:00 — ไขปริศนาทฤษฎีสี วงจรสี คู่สีตรงข้าม วรรณะสี และการผสมสี RYB พร้อมโหมดแข่งขันผ่าน QR Code">
<title>21:00 — THE COLOR ESCAPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&family=Mali:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== 21:00 — THE COLOR ESCAPE  ·  Dark Academia × Cartoon Horror  ·  Mobile First ===== */
:root{
  --bg:#05060d; --ink:#eceeff; --muted:#a3abd0; --line:rgba(255,255,255,.14);
  --panel:rgba(10,12,28,.82); --gold:#ffd84a; --lime:#d8ff5a; --good:#4be08a; --bad:#ff5a6a; --info:#7db4ff;
  --head:'Prompt','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --w:min(92vw,42dvh,420px);          /* ขนาดวงจรสี */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
#app{position:fixed;inset:0;overflow:hidden}
[hidden]{display:none!important}

/* ---------- ฉาก ---------- */
#scene{position:absolute;top:0;left:50%;height:100%;min-width:100%;aspect-ratio:5/3;transform:translateX(-50%);transition:transform 1.4s ease;z-index:1;--lamp:.5}
#scene svg{width:100%;height:100%;display:block}
#scene #lampGlow{opacity:var(--lamp);transition:opacity 1s}
#scene .star{animation:twinkle 3.2s ease-in-out infinite}
#scene .sec{transform-origin:0 0;animation:sweep 60s steps(60) infinite}
#scene .wall-wheel{opacity:0;transition:opacity 2s}
#scene.wheel-on .wall-wheel{opacity:1;filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
#scene .exit-sign{opacity:0;transition:opacity 1s}
#scene.exit-on .exit-sign{opacity:1;animation:glow 1.6s ease-in-out infinite alternate}
#scene #leak{opacity:.35}
.bolt .led{fill:#4be08a;filter:drop-shadow(0 0 4px #4be08a)}
.bolt.locked .led{fill:#ff3d4d;filter:drop-shadow(0 0 4px #ff3d4d)}
.door-sil{transform:translateX(130px);opacity:0}
.door-sil.go{animation:silPass 4.2s linear}
.cd-sil{transform:translateX(160px);opacity:0}
.cd-sil.go{animation:silPass2 4.6s linear}
#creatures{position:fixed;inset:0;pointer-events:none;z-index:2}
#dark{position:fixed;inset:0;background:#02030a;opacity:.12;pointer-events:none;z-index:3;transition:opacity .4s}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,6,.78) 100%)}
#redblue{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 1s;mix-blend-mode:screen}
#redblue.on{opacity:1}
#redblue::before,#redblue::after{content:"";position:absolute;inset:0;animation:rbA 1.6s ease-in-out infinite}
#redblue::before{background:radial-gradient(circle at 0% 100%,rgba(255,40,60,.55),transparent 62%)}
#redblue::after{background:radial-gradient(circle at 100% 0%,rgba(50,110,255,.55),transparent 62%);animation-delay:.8s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

.creature{position:absolute;left:var(--x,-30vw);top:var(--y,10dvh);width:clamp(96px,26vw,200px);opacity:0;
  transform:translate(-50%,0) scale(var(--s,1)) rotate(var(--r,0deg));transform-origin:50% 100%;
  transition:left 1.6s ease,top 1.6s ease,transform 1.6s ease,opacity .9s;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.creature.c{width:clamp(70px,16vw,130px)}
.creature svg{display:block;width:100%;height:auto}
.creature .cr-in{animation:breathe 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.creature.b .cr-in{animation-duration:4.1s}
.creature .eye circle:first-child{filter:drop-shadow(0 0 5px #d8ff5a)}
.creature .pupil{transition:transform .15s}
.creature .eye{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.creature.b .eye{animation-delay:1.7s}
.creature .drip{animation:drip 3s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
.creature .drip.d2{animation-delay:1.2s}
.creature.lunge svg{animation:lunge .7s ease-out}
.creature.recoil svg{animation:recoil .7s ease-out}

/* ---------- หน้าจอ ---------- */
.screen{position:absolute;inset:0;display:none;z-index:5;padding:calc(58px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));min-height:0}
.screen.active{display:flex;animation:fadeIn .55s both}
#scr-gate,#scr-intro,#scr-cut{background:#000;padding-top:calc(16px + env(safe-area-inset-top))}
#scr-cut.over{background:transparent}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%}

h1,h2,h3{font-family:var(--head);margin:0}
.title{font-family:var(--head);font-weight:700;letter-spacing:.04em;line-height:1.05}
.title .big{display:block;font-size:clamp(3rem,16vw,6.2rem);background:linear-gradient(180deg,#fff 10%,#ff7a7a 55%,#7a1d3a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(255,80,120,.35);animation:flickText 6s infinite}
.title .sub{display:block;font-size:clamp(1rem,4.6vw,1.6rem);letter-spacing:.34em;color:var(--lime);margin-top:6px}
.typed{font-family:var(--head);font-size:clamp(1.15rem,5vw,1.7rem);min-height:1.6em;margin:.35em 0;color:#dfe3ff;text-shadow:0 0 18px rgba(150,170,255,.4);opacity:0;transition:opacity .6s}
.typed.in{opacity:1}
.typed.first{font-size:clamp(2.2rem,11vw,4rem);color:#fff;font-weight:700;letter-spacing:.08em}
.hint-tap{color:var(--muted);font-size:.95rem;animation:blinkSlow 1.8s infinite}

/* ---------- ปุ่ม ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:54px;padding:0 26px;border:0;border-radius:16px;cursor:pointer;
  font:600 1.08rem/1 var(--head);color:#171200;background:linear-gradient(#ffe56f,#ffc12e);box-shadow:0 5px 0 #a87708,0 10px 24px rgba(0,0,0,.5);
  transition:transform .12s,box-shadow .12s,filter .2s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a87708}
.btn:disabled{opacity:.4;pointer-events:none;filter:grayscale(.5)}
.btn.big{min-height:64px;font-size:1.3rem;padding:0 38px}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:active{background:rgba(255,255,255,.18);transform:none}
.btn.red{background:linear-gradient(#ff7a7a,#e0334d);color:#fff;box-shadow:0 5px 0 #8e1d30,0 10px 24px rgba(0,0,0,.5)}
.btn.green{background:linear-gradient(#7af0b0,#26c26a);box-shadow:0 5px 0 #14773f,0 10px 24px rgba(0,0,0,.5)}
.btn.sm{min-height:44px;padding:0 16px;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.link{background:none;border:0;color:var(--info);text-decoration:underline;font-size:.95rem;cursor:pointer;padding:10px}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(rgba(3,4,12,.92),rgba(3,4,12,0));pointer-events:none}
#hud>*{pointer-events:auto}
.hud-l{min-width:0;flex:1.2}.hud-r{display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end}.hud-c{flex:1.4;text-align:center}
.hud-stage{font:700 .72rem var(--head);letter-spacing:.14em;color:var(--lime);text-transform:uppercase}
.hud-name{font:600 .92rem var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px;max-width:200px;margin:0 auto}
.seg i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.seg i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffd84a,#ff7a4a);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .6s}
#hudClock{font:700 .8rem var(--head);margin-top:3px;color:#ffb3b3;letter-spacing:.14em;text-shadow:0 0 8px rgba(255,80,80,.6)}
.hud-score{font:700 1.05rem var(--head);color:var(--gold);min-width:2.4em;text-align:right;text-shadow:0 0 12px rgba(255,216,74,.5)}
.hud-score small{font-size:.6em;color:var(--muted);margin-left:2px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(10,12,28,.7);font-size:1.1rem;cursor:pointer;display:grid;place-items:center;padding:0}
.icon-btn:active{background:rgba(255,255,255,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);font:600 .8rem var(--head)}

/* ---------- แผงปริศนา ---------- */
#scr-play{align-items:flex-end;justify-content:center}
.panel{width:min(100%,640px);max-height:100%;overflow-y:auto;overflow-x:hidden;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;box-shadow:0 14px 50px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);
  scrollbar-width:thin;animation:rise .5s both}
.panel.wide{width:min(100%,980px)}
.task{font:600 1.08rem/1.35 var(--head);margin:0 0 4px;text-align:center}
.task b{color:var(--gold)}
.sub{color:var(--muted);font-size:.92rem;text-align:center;margin:0 0 8px}
.cols{display:flex;flex-direction:column;gap:10px;align-items:center}
@media (min-width:860px) and (min-aspect-ratio:5/4){
  .cols.two{flex-direction:row;align-items:center;justify-content:center;gap:26px}
  .cols.two>.work{flex:1;min-width:0}
  :root{--w:min(92vw,56dvh,440px)}
}
.work{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.actions{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.1);font-size:.82rem;color:var(--muted)}

/* ---------- วงจรสี ---------- */
.wheel{position:relative;width:var(--w);aspect-ratio:1;margin:2px auto;flex:none;touch-action:manipulation}
.wheel.sm{--w:min(70vw,32dvh,300px)}
.wheel .zones,.wheel .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.slot{position:absolute;width:16.8%;aspect-ratio:1;left:var(--sx);top:var(--sy);transform:translate(-50%,-50%);padding:0;border:0;background:none;border-radius:50%;cursor:pointer;z-index:2}
.slot::before{content:"";position:absolute;inset:-9%;border-radius:50%}      /* ขยายพื้นที่สัมผัส */
.slot .dot{position:absolute;inset:0;border-radius:50%;background:var(--c);border:2.5px solid rgba(255,255,255,.75);box-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -5px 8px rgba(0,0,0,.25),inset 0 4px 6px rgba(255,255,255,.35);transition:transform .25s,box-shadow .3s,opacity .3s,background .4s}
.slot.empty .dot{background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.3);box-shadow:none}
.slot .tier{position:absolute;inset:0;display:none;place-items:center;font:700 .95em var(--head);color:rgba(255,255,255,.35);pointer-events:none}
.slot.empty .tier{display:grid}
.slot .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150%;text-align:center;font:700 .62rem/1.1 var(--head);color:var(--tc,#fff);text-shadow:var(--ts,0 1px 3px #000,0 0 6px #000);pointer-events:none;display:none}
.wheel.names .slot:not(.empty) .lbl{display:block}
.slot:active .dot{transform:scale(.9)}
.slot.pulse .dot{animation:pulseDot 1s ease-in-out infinite}
.slot.ok .dot{animation:pop .55s;box-shadow:0 0 28px 8px var(--c)}
.slot.bad{animation:shake .42s}
.slot.dim{opacity:.32}
.slot.sel .dot{transform:scale(1.14);border-color:#fff;box-shadow:0 0 24px 6px var(--c)}
.slot.target .dot{box-shadow:0 0 0 4px #fff,0 0 26px 8px var(--c)}
.slot.flag::after{content:"~";position:absolute;right:-2px;top:-6px;font:700 1rem var(--head);color:var(--gold)}
.slot.warm .dot{outline:3px solid rgba(255,140,60,.9);outline-offset:3px}
.slot.cool .dot{outline:3px solid rgba(90,160,255,.9);outline-offset:3px}
.slot:disabled{cursor:default}
.wheel .center{position:absolute;left:50%;top:50%;width:54%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;z-index:1}
.center-card{font:600 .95rem/1.25 var(--head);color:var(--ink)}
.center-card small{display:block;font:500 .72rem var(--body);color:var(--muted)}
.center-swatch{width:62%;aspect-ratio:1;border-radius:50%;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 0 22px var(--c);background:var(--c);transition:background .4s,box-shadow .4s}
.lines line{stroke-width:1.6;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .8s forwards;filter:drop-shadow(0 0 2px currentColor)}
.zones path{opacity:0;transition:opacity 1s}
.zones.on path{opacity:1}
.fly{position:fixed;z-index:20;border-radius:50%;pointer-events:none;border:2.5px solid #fff;transition:left .8s cubic-bezier(.3,.8,.3,1),top .8s cubic-bezier(.3,.8,.3,1),width .8s,height .8s,box-shadow .8s}

/* ---------- จานสี (ด่าน 1) ---------- */
.palette{position:relative;width:min(100%,430px);aspect-ratio:1.5;margin:0 auto}
.palette svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.pcirc{position:absolute;width:17%;aspect-ratio:1;left:var(--px);top:var(--py);transform:translate(-50%,-50%);border:0;padding:0;border-radius:50%;background:none;cursor:pointer;z-index:2}
.pcirc::before{content:"";position:absolute;inset:-12%;border-radius:50%}
.pcirc .dot{position:absolute;inset:0;border-radius:50%;background:var(--c);border:2.5px solid rgba(255,255,255,.55);box-shadow:inset 0 -6px 9px rgba(0,0,0,.28),inset 0 5px 7px rgba(255,255,255,.4),0 3px 7px rgba(0,0,0,.5);transition:transform .2s,box-shadow .3s}
.pcirc .nm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:140%;text-align:center;font:700 .66rem/1.1 var(--head);color:var(--tc,#fff);text-shadow:var(--ts,0 1px 3px #000);pointer-events:none}
.pcirc:active .dot{transform:scale(.88)}
.pcirc.ok .dot{box-shadow:0 0 26px 8px var(--c);animation:pop .55s}
.pcirc.bad{animation:shake .42s}
.pcirc.pulse .dot{animation:pulseDot 1s infinite}
.pcirc.gone{visibility:hidden}
.pcirc.glow .dot{border-color:#fff}

/* ---------- ผสมสี (ด่าน 1) ---------- */
.bowl{position:relative;width:78%;aspect-ratio:1;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 30%,#fff 0,#e8e6f2 40%,#b9b6cf 100%);box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 -6px 12px rgba(0,0,0,.2);display:grid;place-items:center}
.bowl .liquid{width:80%;aspect-ratio:1;border-radius:50%;background:var(--l,#2a2a3a);box-shadow:inset 0 5px 10px rgba(0,0,0,.35),inset 0 -4px 8px rgba(255,255,255,.2);transition:background .5s}
.bowl .liquid.mixing{animation:swirl 1.1s ease-in-out;background:conic-gradient(var(--a),var(--b),var(--a),var(--b),var(--a))}
.bowl .liquid.empty{background:#2c2a3b;box-shadow:inset 0 5px 10px rgba(0,0,0,.6)}
.srcs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.src{width:62px;height:62px;border-radius:50%;border:0;padding:0;background:none;position:relative;cursor:pointer}
.src::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.src .dot{position:absolute;inset:0;border-radius:50%;background:var(--c);border:3px solid rgba(255,255,255,.6);box-shadow:inset 0 -6px 9px rgba(0,0,0,.28),inset 0 5px 7px rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.5);transition:transform .2s}
.src .nm{position:absolute;left:50%;top:105%;transform:translateX(-50%);font:600 .68rem var(--head);white-space:nowrap;color:var(--muted)}
.src.sel .dot{transform:scale(1.15);border-color:#fff;box-shadow:0 0 22px 5px var(--c)}
.src:disabled{opacity:.35}
.srcs.pad{padding-bottom:16px}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:rise .4s both}
.opt{min-width:74px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);padding:8px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 .8rem/1.15 var(--head);transition:transform .15s,border-color .2s}
.opt:active{transform:scale(.94)}
.opt .dot{width:46px;height:46px;border-radius:50%;background:var(--c);border:2.5px solid rgba(255,255,255,.6);box-shadow:inset 0 -5px 8px rgba(0,0,0,.28),inset 0 4px 6px rgba(255,255,255,.35)}
.opt.ok{border-color:var(--good);background:rgba(75,224,138,.18);animation:pop .5s}
.opt.bad{border-color:var(--bad);animation:shake .42s}
.opt.pulse{border-color:var(--gold);animation:pulseDot 1s infinite}
.opt:disabled{opacity:.4}
.dots3{display:flex;gap:8px;justify-content:center}
.dots3 i{width:16px;height:16px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);transition:.3s}
.dots3 i.on{border-style:solid;border-color:#fff;background:var(--c);box-shadow:0 0 12px var(--c)}

/* ---------- Feedback / บทเรียน ---------- */
.fb{min-height:78px;margin-top:8px}
.fb .card{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.07);border-left:5px solid var(--info);animation:rise .35s both;text-align:left}
.fb .card.good{border-color:var(--good);background:rgba(75,224,138,.12)}
.fb .card.bad{border-color:var(--bad);background:rgba(255,90,106,.12)}
.fb .card.hint{border-color:var(--gold);background:rgba(255,216,74,.1)}
.fb .ico{font-size:1.5rem;line-height:1.1}
.fb .tt{font:700 1rem var(--head);margin-bottom:1px}
.fb .tx{font-size:.95rem;color:#dfe3ff;line-height:1.4}
.fb .tx b{color:var(--gold)}
.lesson{display:grid;gap:8px;margin:6px 0 2px}
.lesson .l{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 10px;text-align:left;font-size:.92rem}
.lesson .l .sw{display:flex;flex:none;gap:3px}
.lesson .l .sw i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.lesson h4{margin:0;font:700 .95rem var(--head);color:var(--gold)}
.lesson p{margin:0;color:#d5d9f5}
.bigtitle{font:700 1.3rem var(--head);text-align:center;margin:2px 0 4px}

/* ---------- ด่านที่ 3 ---------- */
.tray{display:flex;gap:10px;width:100%}
.tray>div{flex:1;border-radius:14px;padding:6px 8px;min-height:50px;border:1px dashed var(--line);background:rgba(255,255,255,.04)}
.tray .th{font:700 .74rem var(--head);margin-bottom:4px;letter-spacing:.05em}
.tray .warm .th{color:#ff9a5a}.tray .cool .th{color:#7db4ff}
.tray .warm{border-color:rgba(255,140,60,.5)}.tray .cool{border-color:rgba(90,160,255,.5)}
.tray .chips{display:flex;gap:4px;flex-wrap:wrap;min-height:22px}
.tray .chips i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--c);animation:pop .4s}
.need{display:flex;gap:6px;justify-content:center}
.need i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.need i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}

/* ---------- ด่านที่ 4: ผสมสี ---------- */
.timer{width:100%;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.timer i{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--t,1));background:linear-gradient(90deg,#ff5a6a,#ffd84a 40%,#4be08a)}
.timer-t{font:700 .85rem var(--head);color:var(--muted);display:flex;justify-content:space-between;width:100%;margin-bottom:2px}
.cmp{display:flex;width:100%;height:clamp(92px,17dvh,150px);border-radius:20px;overflow:hidden;border:3px solid rgba(255,255,255,.8);box-shadow:0 6px 24px rgba(0,0,0,.6);position:relative;background:#222}
.cmp>div{flex:1;position:relative;transition:background .08s linear}
.cmp .t{background:var(--tc)}.cmp .m{background:var(--mc)}
.cmp span{position:absolute;left:10px;bottom:6px;font:700 .72rem var(--head);padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.cmp .m span{left:auto;right:10px}
.chan{width:100%}
.chan .rr{display:flex;align-items:center;gap:6px}
.chan .nm{display:flex;align-items:center;gap:6px;width:76px;flex:none;font:700 .86rem var(--head)}
.chan .nm i{width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid #fff;flex:none}
.chan .v{font:700 .95rem var(--head);color:var(--gold);width:3.1em;text-align:right;flex:none}
.step{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.09);font:700 1.3rem var(--head);cursor:pointer;display:grid;place-items:center;padding:0}
.step:active{background:rgba(255,255,255,.25)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:38px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#fff,var(--c));border:1px solid rgba(255,255,255,.4)}
input[type=range]::-moz-range-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#fff,var(--c));border:1px solid rgba(255,255,255,.4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;margin-top:-13px;background:#fff;border:5px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.result{display:grid;gap:8px;text-align:center}
.result .pts{font:700 2.6rem var(--head);color:var(--gold);line-height:1;text-shadow:0 0 18px rgba(255,216,74,.5)}
.result .pts small{font-size:.4em;color:var(--muted)}
.bars{display:grid;gap:6px;text-align:left}
.bars .b{display:grid;grid-template-columns:96px 1fr 54px;gap:8px;align-items:center;font:600 .85rem var(--head)}
.bars .track{height:12px;border-radius:7px;background:rgba(255,255,255,.12);overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#ff7a4a,#ffd84a);transform-origin:left;animation:grow 1s both}
.bars .b span:last-child{text-align:right;color:var(--gold)}
.recipe{display:flex;gap:8px;justify-content:center;font-size:.85rem;flex-wrap:wrap}
.recipe .r{background:rgba(255,255,255,.07);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px}
.recipe .sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.recipe b{color:var(--gold)}
.mini-r{font-size:.78rem;color:var(--muted)}
.countdown{font:700 clamp(5rem,30vw,12rem) var(--head);color:#fff;text-shadow:0 0 40px var(--lime);animation:cdPop 1s both}

/* ---------- คัตซีน ---------- */
.cut-wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center}
.cut-view{flex:1;min-height:0;width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.cut-view>svg{max-height:100%;max-width:min(100%,520px);width:100%;height:100%}
.cut-view.full>svg{max-width:none}
.cut-cap{width:min(100%,640px);min-height:112px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));text-align:center;font:500 clamp(1.05rem,4.3vw,1.35rem)/1.5 var(--head);text-shadow:0 2px 8px #000;color:#eef0ff;display:flex;flex-direction:column;justify-content:center;gap:6px}
.cut-cap .who{font:700 .8rem var(--head);letter-spacing:.2em;color:var(--lime)}
.cut-skip{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:3;font-size:.8rem;color:var(--muted);background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.chalk{width:min(88%,500px);aspect-ratio:1.6;border:10px solid #5d3b24;border-radius:8px;background:linear-gradient(135deg,#22362f,#16231f);box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 0 40px rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;
  font:500 clamp(1.2rem,5.4vw,1.9rem)/1.55 'Mali','Prompt',cursive;color:#f3f1e4;text-shadow:0 0 6px rgba(255,255,255,.4);white-space:pre-line}
.pa{display:grid;place-items:center;gap:10px}
.pa .spk{width:130px;height:130px;border-radius:24px;background:repeating-linear-gradient(0deg,#2c2c3a 0 6px,#1a1a26 6px 12px);border:4px solid #444a5e;box-shadow:0 0 30px rgba(120,160,255,.3);position:relative;display:grid;place-items:center;font-size:3rem}
.pa .spk.talk::after{content:"";position:absolute;inset:-14px;border-radius:34px;border:3px solid rgba(130,170,255,.55);animation:ring 1s infinite}
.pa .spk.talk::before{content:"";position:absolute;inset:-28px;border-radius:44px;border:2px solid rgba(130,170,255,.3);animation:ring 1s .3s infinite}
.stage-card{text-align:center}
.stage-card .n{font:700 .9rem var(--head);letter-spacing:.4em;color:var(--lime)}
.stage-card .t{font:700 clamp(1.8rem,8.5vw,3rem)/1.1 var(--head);margin:6px 0;background:linear-gradient(#fff,#ffb4d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage-card .s{font:500 1.1rem var(--head);color:var(--gold);margin-bottom:6px}
.stage-card .d{color:var(--muted);max-width:30em;margin:0 auto}

/* ---------- Brief (เปิดห้อง) ---------- */
#scr-brief{align-items:flex-end;justify-content:center;padding-top:0}
.brief-box{width:min(100%,640px);background:linear-gradient(rgba(5,6,16,.2),rgba(5,6,16,.92) 30%);border-radius:22px;padding:22px 16px 16px;text-align:center}
.brief-box .line{font:500 clamp(1rem,4.2vw,1.25rem)/1.5 var(--head);min-height:3.2em;color:#eef0ff}
.hot{position:absolute;transform:translate(-50%,-50%);padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);font:600 .75rem var(--head);color:#fff;opacity:0;transition:opacity .6s;white-space:nowrap;z-index:2;pointer-events:none}
.hot.on{opacity:1}

/* ---------- Lobby / Join / Leaderboard ---------- */
.card{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 14px 50px rgba(0,0,0,.7);width:min(100%,560px)}
.scroll{overflow-y:auto;max-height:100%;width:100%;display:flex;justify-content:center;align-items:flex-start;padding-bottom:20px}
.scroll>.card{margin:auto 0}
.field{width:100%;height:56px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:600 1.15rem var(--head);padding:0 16px;outline:none;-webkit-user-select:text;user-select:text;text-align:center}
.field:focus{border-color:var(--gold)}
.field.code{letter-spacing:.5em;text-transform:uppercase;font-size:1.5rem;text-indent:.5em}
.roomcode{font:700 clamp(2.8rem,15vw,4.6rem)/1 var(--head);letter-spacing:.2em;text-indent:.2em;color:var(--lime);text-shadow:0 0 24px rgba(216,255,90,.5)}
.qr{background:#fff;border-radius:16px;padding:6px;width:min(64vw,240px);aspect-ratio:1;margin:0 auto;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.6)}
.qr svg{width:100%;height:100%;display:block;border-radius:10px}
.urlbox{font-size:.78rem;color:var(--muted);word-break:break-all;background:rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;-webkit-user-select:text;user-select:text;text-align:center}
.warn{display:flex;gap:10px;align-items:flex-start;background:rgba(255,170,60,.12);border:1px solid rgba(255,170,60,.5);color:#ffd9a3;border-radius:14px;padding:10px 12px;font-size:.88rem;line-height:1.4;text-align:left}
.warn.info{background:rgba(125,180,255,.1);border-color:rgba(125,180,255,.45);color:#cfe3ff}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%}
.plist li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font:600 1rem var(--head);animation:rise .35s both;text-align:left}
.plist .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;background:var(--c);color:#111;flex:none}
.plist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .you{font-size:.72rem;color:var(--lime)}
.plist .off{opacity:.45}
.dot-on,.dot-off{width:9px;height:9px;border-radius:50%;flex:none}
.dot-on{background:var(--good);box-shadow:0 0 8px var(--good)}.dot-off{background:#777}
.lb{display:grid;gap:8px;position:relative;width:100%}
.lb-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:16px;padding:8px 12px;transition:transform .7s cubic-bezier(.3,.8,.3,1),background .4s;position:relative;overflow:hidden;text-align:left}
.lb-row .pl{font:700 1.5rem var(--head);text-align:center}
.lb-row .nm{font:700 1.05rem var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sub2{font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.lb-row .sc{font:700 1.4rem var(--head);color:var(--gold)}
.lb-row .sc small{font-size:.55em;color:var(--muted)}
.lb-row .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff7a4a,#ffd84a);transform-origin:left;transform:scaleX(var(--b,0));width:100%;transition:transform .8s}
.lb-row.me{outline:2px solid var(--lime)}
.lb-row.p1{background:linear-gradient(90deg,rgba(255,216,74,.28),rgba(255,255,255,.08))}
.lb-row.p2{background:linear-gradient(90deg,rgba(210,220,240,.2),rgba(255,255,255,.08))}
.lb-row.p3{background:linear-gradient(90deg,rgba(214,140,80,.22),rgba(255,255,255,.08))}
.dots5{display:flex;gap:3px}.dots5 i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}.dots5 i.on{background:var(--good)}
.winner{text-align:center;position:relative}
.winner .crown{font-size:3.4rem;animation:bounce 1s infinite}
.winner .wn{font:700 clamp(1.8rem,9vw,3rem)/1.1 var(--head);background:linear-gradient(#fff3a0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,0,.6))}
.spot{position:absolute;inset:-30px -10px;background:radial-gradient(ellipse at 50% 0,rgba(255,240,180,.35),transparent 65%);pointer-events:none;animation:glow 1.5s infinite alternate}
.rankchip{font:700 .85rem var(--head);padding:3px 10px;border-radius:99px;background:rgba(255,216,74,.18);color:var(--gold)}
.conn{font-size:.72rem;display:flex;align-items:center;gap:6px;color:var(--muted)}

/* ---------- Modal / Toast ---------- */
#modal{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,6,.74);backdrop-filter:blur(4px)}
#modal.open{display:flex;animation:fadeIn .25s both}
#modal .box{width:min(100%,420px);max-height:100%;overflow:auto;background:#10132a;border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center;box-shadow:0 20px 60px #000}
#modal h3{font-size:1.3rem;margin-bottom:6px}
#modal p{color:var(--muted);margin:6px 0 14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:13;background:#161a36;border:1px solid var(--line);border-radius:99px;padding:10px 18px;font:600 .92rem var(--head);opacity:0;pointer-events:none;transition:.35s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.end-score{font:700 clamp(3rem,16vw,5rem)/1 var(--head);color:var(--gold);text-shadow:0 0 30px rgba(255,216,74,.5)}
.end-score small{font-size:.35em;color:var(--muted)}
.final-line{font:600 clamp(1.15rem,5vw,1.6rem)/1.5 var(--head);color:#ffd3d3;text-shadow:0 0 18px rgba(255,60,80,.5);max-width:24em;margin:0 auto}
.ver{position:fixed;left:8px;bottom:6px;font-size:.66rem;color:rgba(255,255,255,.28);z-index:6;pointer-events:none}

/* ---------- Animations ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 3px #5dffa0)}to{filter:drop-shadow(0 0 12px #5dffa0)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes drip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.5)}}
@keyframes lunge{0%{transform:scale(1)}35%{transform:scale(1.45) translateY(10px)}100%{transform:scale(1)}}
@keyframes recoil{0%{transform:scale(1)}30%{transform:scale(.7) translateY(-8px)}100%{transform:scale(1)}}
@keyframes silPass{0%{transform:translateX(130px);opacity:1}100%{transform:translateX(-170px);opacity:1}}
@keyframes silPass2{0%{transform:translateX(170px);opacity:1}100%{transform:translateX(-200px);opacity:1}}
@keyframes pulseDot{0%,100%{transform:scale(1);box-shadow:0 0 10px var(--c,#fff)}50%{transform:scale(1.14);box-shadow:0 0 26px 6px var(--c,#fff)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 7px),-50%)}40%{transform:translate(calc(-50% + 7px),-50%)}60%{transform:translate(calc(-50% - 5px),-50%)}80%{transform:translate(calc(-50% + 5px),-50%)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes swirl{0%{transform:rotate(0)}100%{transform:rotate(540deg)}}
@keyframes rbA{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes flickText{0%,19%,21%,60%,62%,100%{opacity:1}20%,61%{opacity:.4}63%{opacity:.8}}
@keyframes blinkSlow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.shake-all{animation:shakeAll .4s}
@keyframes shakeAll{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

@media (max-height:640px){:root{--w:min(88vw,36dvh,380px)}.task{font-size:1rem}.btn{min-height:48px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.lines line.guide{stroke-dasharray:3 3;stroke-dashoffset:0;animation:none;opacity:.8}
.mixwheel{position:relative;width:min(60vw,24dvh,230px);aspect-ratio:1;border-radius:50%;background:var(--ring);padding:10%;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.35);margin:0 auto}
.mixwheel .in{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 20px rgba(0,0,0,.3)}
.mixwheel .in>div{flex:1;transition:background .08s linear}
.mixwheel .in .t{background:var(--tc)}.mixwheel .in .m{background:var(--mc)}
.mix-labels{display:flex;justify-content:space-around;width:min(60vw,24dvh,230px);margin:4px auto 0;font:700 .74rem var(--head);color:var(--muted)}
.btn.block{width:100%}
.cut-view.pad{padding:8px}
.cdoor-open #cdDoorLeaf{transition:transform 3s ease-in-out;transform:perspective(900px) rotateY(-78deg)}
#cdDoorLeaf{transition:transform 3s ease-in-out}
#cdOpening{transition:opacity 3s}
.cd-lock.glow{filter:drop-shadow(0 0 12px #fff);animation:glow 1s infinite alternate}
.shadow2{animation:creep 6s ease-in forwards;opacity:0}
@keyframes creep{0%{opacity:0;transform:translateX(-60px)}40%{opacity:1}100%{opacity:1;transform:translateX(0)}}
.cut-wrap.final .cut-cap{color:#ffd3d3}

#cutSchool .star{animation:twinkle 3.2s ease-in-out infinite}
#cutSchool .sc-walk{transform:translate(120px,392px);animation:scWalk 7s ease-in-out forwards}
@keyframes scWalk{0%{transform:translate(206px,392px) scale(.8)}100%{transform:translate(90px,402px) scale(1)}}
#cutSchool .sc-cat{opacity:0;transition:opacity 1.6s}
#cutSchool .sc-cat.show{opacity:1}
#cutSchool .sc-tail{transform-box:fill-box;transform-origin:0 100%;animation:tailSway 2.4s ease-in-out infinite}
@keyframes tailSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
#cutSchool .sc-eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
#cutSchool .sc-eyes ellipse{filter:drop-shadow(0 0 3px #b6ff3b)}
#cutSchool #scArtWin{animation:winFlick 3s infinite}
@keyframes winFlick{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.5}53%{opacity:1}}
.cut-cap .big{display:block;font:700 clamp(1.5rem,7vw,2.4rem)/1.3 var(--head);text-shadow:0 0 22px rgba(255,255,255,.35)}
.cut-cap .big.red{color:#ffd3d3;text-shadow:0 0 24px rgba(255,60,80,.55)}
.final-line.big{font-size:clamp(2rem,10vw,3.2rem);letter-spacing:.06em}

</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div id="creatures"></div>
  <div id="redblue"></div>
  <div id="dark"></div>
  <div id="vignette"></div>

  <header id="hud" hidden>
    <div class="hud-l"><div class="hud-stage" id="hudStage">ด่าน 1</div><div class="hud-name" id="hudName"></div></div>
    <div class="hud-c"><div class="seg" id="hudSeg"><i></i><i></i><i></i><i></i></div><div id="hudClock">21:00</div></div>
    <div class="hud-r"><span class="rankchip" id="hudRank" hidden></span><div class="hud-score" id="hudScore">0<small>แต้ม</small></div>
      <button class="icon-btn" id="btnSound" aria-label="เปิด/ปิดเสียง">🔊</button><button class="icon-btn" id="btnMenu" aria-label="เมนู">☰</button></div>
  </header>

  <!-- เกต: แตะเพื่อปลดล็อกเสียง -->
  <section class="screen active" id="scr-gate">
    <div class="center" id="gateBox">
      <div class="title"><span class="big">21:00</span><span class="sub">THE COLOR ESCAPE</span></div>
      <p class="hint-tap" style="margin-top:28px">แตะหน้าจอเพื่อเริ่ม · แนะนำให้เปิดเสียง 🔊</p>
    </div>
  </section>

  <!-- Intro -->
  <section class="screen" id="scr-intro">
    <div class="center" id="introBox">
      <div id="introLines" style="min-height:11em"></div>
      <div id="introBtns" class="stack" style="margin-top:18px;opacity:0;pointer-events:none;transition:opacity 1s">
        <button class="btn big" id="btnStart">START</button>
        <button class="btn ghost" id="btnContinue" hidden>เล่นต่อ</button>
        <button class="btn ghost" id="btnRejoin" hidden>↩ กลับเข้าห้องเดิม</button>
        <div class="row" style="margin-top:4px">
          <button class="btn ghost sm" id="btnCreate">👥 สร้างห้องแข่งขัน</button>
          <button class="btn ghost sm" id="btnJoin">🔑 เข้าร่วมห้อง</button>
        </div>
        <button class="link" id="btnResetSave" hidden>ล้างความคืบหน้า</button>
      </div>
    </div>
  </section>

  <!-- แผงเล่นด่าน -->
  <section class="screen" id="scr-play"><div class="panel" id="panel"></div></section>

  <!-- Cutscene -->
  <section class="screen" id="scr-cut"><div class="cut-wrap">
    <button class="cut-skip" id="cutSkip">แตะเพื่อข้ามฉาก ▶▶</button>
    <div class="cut-view" id="cutView"></div>
    <div class="cut-cap" id="cutCap"></div>
  </div></section>

  <!-- Join -->
  <section class="screen" id="scr-join"><div class="scroll"><div class="card"><div class="stack" id="joinBox"></div></div></div></section>
  <!-- Lobby -->

<script>
'use strict';
/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  ตั้งค่า FIREBASE (Multiplayer ข้ามอุปกรณ์)  — แก้เฉพาะตรงนี้ที่เดียว       ║
   ╠══════════════════════════════════════════════════════════════════════════╣

   ║                                                                          ║
   ║  ช่องที่เกมใช้จริงมีช่องเดียวคือ  databaseURL  (ต้องกรอก)                  ║
   ║  ช่องอื่นเว้นไว้ให้วางทั้งก้อนที่ Firebase ให้มาได้เลย เกมไม่ได้ใช้ ปล่อยว่างได้ ║
   ║  ถ้าเว้น databaseURL ว่างไว้ เกมจะทำงานใน "โหมดจำลอง" (ข้ามเครื่องไม่ได้)    ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",        // ← ต้องกรอก เช่น "https://ชื่อโปรเจกต์-default-rtdb.asia-southeast1.firebasedatabase.app"
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
/* ───────────────────────── จบส่วนตั้งค่า — ด้านล่างนี้ไม่ต้องแก้ ───────────────────────── */

;
'use strict';
/* =====================================================================
   TCE CORE — ส่วนที่ไม่พึ่ง DOM (ทดสอบด้วย Node ได้)
   1) Color : วงจรสี 12 สี, ระบบผสมสี RYB, ΔE (Lab), ระบบคะแนน
   2) QR    : ตัวสร้าง QR Code จริง (byte mode, version 1-10, ECC L/M)
   3) Net   : ตัวเชื่อม Multiplayer  (LocalBackend / FirebaseBackend)
   ===================================================================== */
const TCE = {};

(function () {
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  TCE.clamp = clamp;

  /* ---------- สุ่มแบบกำหนด seed ได้ ---------- */
  TCE.rng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  TCE.shuffle = function (arr, rnd) {
    rnd = rnd || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  /* =================================================================
     1) COLOR
     ================================================================= */
  // มุมของลูกบาศก์ RYB (ปริมาณแดง,เหลือง,น้ำเงิน = 0/1)  →  ค่า RGB
  // ใช้แนว Gosset–Chen (trilinear) แต่ปรับมุมให้ตรงกับสีบนวงจรสีของเกม
  const CORNER = {
    '000': [255, 255, 255],  // ไม่มีสีเลย = กระดาษขาว
    '100': [232, 16, 44],    // แดง
    '010': [255, 230, 0],    // เหลือง
    '001': [30, 90, 230],    // น้ำเงิน
    '110': [255, 122, 0],    // ส้ม  (แดง+เหลือง)
    '011': [31, 168, 74],    // เขียว (เหลือง+น้ำเงิน)
    '101': [111, 45, 168],   // ม่วง (แดง+น้ำเงิน)
    '111': [59, 42, 32]      // ครบสามสี = น้ำตาลเข้ม
  };

  /** r,y,b = 0..100 (ปริมาณสี %)  →  [R,G,B] 0..255 */
  function rybToRgb(r, y, b) {
    r = clamp(r, 0, 100) / 100; y = clamp(y, 0, 100) / 100; b = clamp(b, 0, 100) / 100;
    const out = [0, 0, 0];
    for (let i = 0; i < 8; i++) {
      const cr = (i >> 2) & 1, cy = (i >> 1) & 1, cb = i & 1;
      const w = (cr ? r : 1 - r) * (cy ? y : 1 - y) * (cb ? b : 1 - b);
      if (w === 0) continue;
      const c = CORNER['' + cr + cy + cb];
      out[0] += w * c[0]; out[1] += w * c[1]; out[2] += w * c[2];
    }
    return out.map(v => Math.round(clamp(v, 0, 255)));
  }
  const hex2 = n => n.toString(16).padStart(2, '0');
  const rgbToHex = c => '#' + hex2(c[0]) + hex2(c[1]) + hex2(c[2]);

  /* ---------- sRGB → CIE Lab, ΔE76 ---------- */
  function rgbToLab(c) {
    const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const r = f(c[0]), g = f(c[1]), b = f(c[2]);
    let x = (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) / 0.95047;
    let y = (r * 0.2126729 + g * 0.7151522 + b * 0.0721750);
    let z = (r * 0.0193339 + g * 0.1191920 + b * 0.9503041) / 1.08883;
    const t = v => v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116;
    x = t(x); y = t(y); z = t(z);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }
  function deltaE(c1, c2) {
    const a = rgbToLab(c1), b = rgbToLab(c2);
    return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  }

  /* ---------- วงจรสี 12 สี (เรียงตามเข็มนาฬิกา เริ่มที่บนสุด) ---------- */
  const DEF = [
    { id: 'Y',  name: 'เหลือง',       tier: 1, ryb: [0, 100, 0] },
    { id: 'YO', name: 'เหลืองส้ม',    tier: 3, ryb: [50, 100, 0] },
    { id: 'O',  name: 'ส้ม',          tier: 2, ryb: [100, 100, 0] },
    { id: 'RO', name: 'แดงส้ม',       tier: 3, ryb: [100, 50, 0] },
    { id: 'R',  name: 'แดง',          tier: 1, ryb: [100, 0, 0] },
    { id: 'RV', name: 'แดงม่วง',      tier: 3, ryb: [100, 0, 50] },
    { id: 'V',  name: 'ม่วง',         tier: 2, ryb: [100, 0, 100] },
    { id: 'BV', name: 'น้ำเงินม่วง',  tier: 3, ryb: [50, 0, 100] },
    { id: 'B',  name: 'น้ำเงิน',      tier: 1, ryb: [0, 0, 100] },
    { id: 'BG', name: 'น้ำเงินเขียว', tier: 3, ryb: [0, 50, 100] },
    { id: 'G',  name: 'เขียว',        tier: 2, ryb: [0, 100, 100] },
    { id: 'YG', name: 'เหลืองเขียว',  tier: 3, ryb: [0, 100, 50] }
  ];
  // วรรณะตามบทเรียน: ตำแหน่ง 0-5 (เหลือง→แดงม่วง) = ร้อน, 6-11 (ม่วง→เหลืองเขียว) = เย็น
  // สีรอยต่อที่ตีความได้ทั้งสองฝั่ง: แดงม่วง (5), ม่วง (6), เหลืองเขียว (11)
  const BORDERLINE = [5, 6, 11];
  const WHEEL = DEF.map((d, i) => {
    const rgb = rybToRgb(d.ryb[0], d.ryb[1], d.ryb[2]);
    return Object.assign({ idx: i, rgb, hex: rgbToHex(rgb), group: i <= 5 ? 'warm' : 'cool', borderline: BORDERLINE.includes(i) }, d);
  });
  const IDX = {}; WHEEL.forEach(w => IDX[w.id] = w.idx);

  const circDist = (a, b) => { const d = Math.abs(a - b) % 12; return Math.min(d, 12 - d); };
  const opposite = i => (i + 6) % 12;
  /** วรรณะที่ถูกต้อง: ตามบทเรียน หรือเป็นสีรอยต่อที่ยอมรับได้ทั้งสองฝั่ง */
  function acceptsGroup(i, group) {
    const w = WHEEL[i];
    return w.group === group || w.borderline;
  }

  /**
   * ผสมสี 2 สีบนวงจร (ใช้ในด่าน 1)
   * return {kind, result?}  kind: same | secondary | tertiary | neutral | muddy
   */
  function classifyMix(a, b) {
    if (a === b) return { kind: 'same' };
    const d = circDist(a, b), A = WHEEL[a], B = WHEEL[b];
    const delta = (b - a + 12) % 12;                               // ระยะตามเข็มนาฬิกาจาก a ไป b
    // กึ่งกลางของส่วนโค้งที่สั้นกว่า (ใช้ได้เมื่อ d เป็นเลขคู่)
    const mid = delta <= 6 ? (a + d / 2) % 12 : (b + d / 2) % 12;
    if (d === 6) return { kind: 'neutral' };                       // ตรงข้ามกัน → หม่น
    if (A.tier === 1 && B.tier === 1) return { kind: 'secondary', result: mid };   // แม่สี+แม่สี (d=4)
    if (d === 2 && A.tier + B.tier === 3) return { kind: 'tertiary', result: mid }; // แม่สี + สีขั้นที่ 2 ที่อยู่ติดกัน
    if (A.tier === 2 && B.tier === 2) return { kind: 'muddy' };    // ส้ม+เขียว ฯลฯ มีแม่สีครบทั้ง 3 → หม่น
    if (d === 2 || d === 4) return { kind: 'known', result: mid }; // ได้สีที่อยู่ในวงจรอยู่แล้ว
    return { kind: 'muddy' };                                      // เช่น สีขั้นที่ 2 + สีขั้นที่ 2 (มีครบ 3 แม่สี)
  }

  /* ---------- ระบบคะแนนด่านสุดท้าย (100 คะแนน/รอบ) ---------- */
  const TIME_FULL = 5, TIME_ZERO = 45;      // ≤5 วิ เต็ม, ≥45 วิ = 0
  function scoreRound(targetRgb, mixRgb, seconds) {
    const dE = deltaE(targetRgb, mixRgb);
    const pct = clamp(1 - (dE - 3) / 42, 0, 1);                    // ΔE ≤ 3 = 100%
    const closePts = Math.round(70 * pct);                         // ความใกล้เคียง 70
    const timeFactor = clamp((TIME_ZERO - seconds) / (TIME_ZERO - TIME_FULL), 0, 1);
    const acc = Math.min(1, pct / 0.5);                            // กันการกดส่งเร็วโดยไม่ผสมจริง
    const timePts = Math.round(30 * timeFactor * acc);             // ความรวดเร็ว 30
    return { dE, pct, closePts, timePts, total: closePts + timePts };
  }

  /** สร้างสีเป้าหมาย n รอบ (ปริมาณ [แดง,เหลือง,น้ำเงิน]) ง่าย → ยาก */
  function makeTargets(n, seed) {
    const rnd = TCE.rng(seed == null ? (Math.random() * 4294967296) : seed);
    const steps = [25, 25, 10, 5, 5];
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 20000) {
      const i = out.length, st = steps[Math.min(i, steps.length - 1)];
      const pick = () => Math.round(rnd() * (100 / st)) * st;
      const v = [pick(), pick(), pick()];
      const nz = v.filter(x => x > 0).length;
      if (i < 2 ? nz !== 2 : nz < 2) continue;
      const rgb = rybToRgb(v[0], v[1], v[2]);
      const L = rgbToLab(rgb)[0];
      if (L < 25 || L > 90) continue;                              // ไม่เข้ม/ซีดจนแยกยาก
      if (out.some(t => deltaE(rgb, rybToRgb(t[0], t[1], t[2])) < 22)) continue;
      out.push(v);
    }
    return out;
  }

  TCE.Color = { rybToRgb, rgbToHex, rgbToLab, deltaE, WHEEL, IDX, BORDERLINE, circDist, opposite, acceptsGroup, classifyMix, scoreRound, makeTargets, TIME_FULL, TIME_ZERO };

  /* =================================================================
     2) QR CODE  (อิงอัลกอริทึมมาตรฐาน ISO/IEC 18004 — byte mode)
        รองรับ version 1–10, ECC ระดับ L/M  (พอสำหรับ URL ยาวราว 200 ตัวอักษร)
     ================================================================= */
  const ECC_PER_BLOCK = { L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18], M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26] };
  const NUM_BLOCKS    = { L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4],         M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5] };
  const ECC_FORMAT    = { L: 1, M: 0 };

  function rawDataModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) { const na = Math.floor(ver / 7) + 2; r -= (25 * na - 10) * na - 55; if (ver >= 7) r -= 36; }
    return r;
  }
  const dataCodewords = (ver, ecc) => Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK[ecc][ver] * NUM_BLOCKS[ecc][ver];

  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
    return z;
  }
  function rsDivisor(degree) {
    const res = new Array(degree).fill(0); res[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < res.length; j++) { res[j] = gfMul(res[j], root); if (j + 1 < res.length) res[j] ^= res[j + 1]; }
      root = gfMul(root, 0x02);
    }
    return res;
  }
  function rsRemainder(data, divisor) {
    const res = divisor.map(() => 0);
    for (const b of data) {
      const factor = b ^ res.shift(); res.push(0);
      divisor.forEach((coef, i) => { res[i] ^= gfMul(coef, factor); });
    }
    return res;
  }
  const getBit = (x, i) => ((x >>> i) & 1) !== 0;

  function qrEncode(text, ecc) {
    ecc = ecc || 'M';
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 0;
    for (let v = 1; v <= 10; v++) {
      const lenBits = v < 10 ? 8 : 16;
      if (4 + lenBits + 8 * bytes.length <= dataCodewords(v, ecc) * 8) { ver = v; break; }
    }
    if (!ver && ecc === 'M') return qrEncode(text, 'L');           // ลองลดระดับ ECC ก่อนยอมแพ้
    if (!ver) throw new Error('ข้อความยาวเกินไปสำหรับ QR (สูงสุดประมาณ 270 ไบต์)');
    const size = ver * 4 + 17;

    // --- 1) bit stream ---
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(0x4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const capBits = dataCodewords(ver, ecc) * 8;
    put(0, Math.min(4, capBits - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let v = 0; for (let k = 0; k < 8; k++) v = (v << 1) | bits[i + k]; data.push(v); }

    // --- 2) Reed-Solomon + interleave ---
    const nb = NUM_BLOCKS[ecc][ver], eccLen = ECC_PER_BLOCK[ecc][ver];
    const raw = Math.floor(rawDataModules(ver) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += dat.length;
      const e = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(e));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((blk, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(blk[i]); });

    // --- 3) วางโมดูล ---
    const mod = [], isFn = [];
    for (let y = 0; y < size; y++) { mod.push(new Array(size).fill(false)); isFn.push(new Array(size).fill(false)); }
    const setFn = (x, y, dark) => { mod[y][x] = dark; isFn[y][x] = true; };

    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    // alignment patterns
    let pos = [];
    if (ver > 1) {
      const na = Math.floor(ver / 7) + 2;
      const step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2;
      pos = [6];
      for (let p = size - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
    }
    for (let i = 0; i < pos.length; i++) for (let j = 0; j < pos.length; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === pos.length - 1) || (i === pos.length - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setFn(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = (ECC_FORMAT[ecc] << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const f = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFn(8, i, getBit(f, i));
      setFn(8, 7, getBit(f, 6)); setFn(8, 8, getBit(f, 7)); setFn(7, 8, getBit(f, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(f, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(f, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(f, i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const vb = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const c = getBit(vb, i), a = size - 11 + i % 3, b = Math.floor(i / 3);
        setFn(a, b, c); setFn(b, a, c);
      }
    }
    // วางข้อมูลแบบซิกแซก
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!isFn[y][x] && bi < all.length * 8) { mod[y][x] = getBit(all[bi >>> 3], 7 - (bi & 7)); bi++; }
      }
    }
    // เลือก mask ที่ penalty ต่ำสุด
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        let inv;
        switch (m) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inv = x * y % 2 + x * y % 3 === 0; break;
          case 6: inv = (x * y % 2 + x * y % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + x * y % 3) % 2 === 0;
        }
        if (!isFn[y][x] && inv) mod[y][x] = !mod[y][x];
      }
    };
    const penalty = () => {
      let p = 0;
      const line = get => {
        let run = 1;
        for (let i = 1; i < size; i++) {
          if (get(i) === get(i - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
        }
      };
      for (let y = 0; y < size; y++) line(i => mod[y][i]);
      for (let x = 0; x < size; x++) line(i => mod[i][x]);

  }

  function measure() {
    if (!host) return;
    const w = host.getBoundingClientRect().width, vw = window.innerWidth;
    maxPan = Math.max(0, (w - vw) / 2);
    apply(0);
  }
  function apply(ms) {
    host.style.transitionDuration = (ms || 0) + 'ms';
    host.style.transform = `translateX(calc(-50% + ${(-panV * maxPan).toFixed(1)}px))`;
  }

  return {
    init() {
      host = document.getElementById('scene');
      host.innerHTML = sceneSVG();
      svgEl = host.querySelector('svg');
      measure(); window.addEventListener('resize', measure);
    },
    /** แพนกล้อง: -1 = ดูฝั่งซ้ายสุด (หน้าต่าง/ขาตั้งภาพ), 0 = กลาง, 1 = ดูฝั่งขวาสุด (ประตู) */
    pan(v, ms) { panV = Math.max(-1, Math.min(1, v)); apply(ms == null ? 1400 : ms); },
    get maxPan() { return maxPan; },
    /** ตั้งสภาพห้องตามด่าน */
    setStage(n) {
      document.body.dataset.stage = n;
      const lamp = { 1: 0.5, 2: 0.85, 3: 0.55, 4: 0.7 }[n] || 0.5;
      host.style.setProperty('--lamp', lamp);
      host.classList.toggle('wheel-on', n >= 2);
      host.classList.toggle('exit-on', n >= 4);
      [0, 1, 2].forEach(i => svgEl.querySelector('#bolt' + i).classList.toggle('locked', i >= n - 1));
      const target = { 1: -0.25, 2: 0.05, 3: 0.55, 4: 1 }[n];
      this.pan(target == null ? 0 : target, 1600);
    },
    openBolt(i) { svgEl.querySelector('#bolt' + i).classList.remove('locked'); },
    silPass() { const s = svgEl.querySelector('#doorSil'); s.classList.remove('go'); void s.getBoundingClientRect(); s.classList.add('go'); },
    el() { return host; }
  };
})();

/* ---------------- สิ่งมีชีวิต (overlay HTML + SVG) ---------------- */
const Creatures = (function () {
  const PAINT = TCE.Color.WHEEL;
  let root, level = 0, list = {};

  const eye = (cx, cy, r) => `<g class="eye" style="--ex:${cx}px;--ey:${cy}px"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#f6ffd0"/><circle class="pupil" cx="${cx}" cy="${cy}" r="${(r * 0.46).toFixed(1)}" fill="#12081f"/></g>`;
  const A = () => `<svg viewBox="-80 -130 160 150" overflow="visible"><g class="cr-in">
    <path class="cr-body" d="M-62,2 C-74,-60 -42,-112 0,-114 C46,-116 76,-62 64,2 C52,14 32,6 24,16 C16,28 6,8 -6,18 C-18,30 -28,10 -40,16 C-52,22 -60,12 -62,2Z" fill="#1c1033" stroke="#7b4fe0" stroke-opacity=".55" stroke-width="3"/>

    <path class="drip" d="M-30,14 v16 q0,6 5,6 t5,-6 v-16z" fill="#1c1033"/><path class="drip d2" d="M18,16 v22 q0,6 5,6 t5,-6 v-22z" fill="#1c1033"/>
    ${eye(-22, -72, 15)}${eye(12, -88, 9)}${eye(30, -62, 12)}${eye(-4, -54, 6)}
    <path d="M-26,-34 q7,10 13,0 q7,10 13,0 q7,10 13,0 q7,10 13,0" stroke="#d8ff5a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g></svg>`;
  const B = () => `<svg viewBox="-80 -170 160 190" overflow="visible"><g class="cr-in">
    <path class="cr-body" d="M-34,6 C-48,-50 -36,-130 0,-138 C36,-130 48,-50 34,6 C22,14 12,4 0,12 C-12,4 -22,14 -34,6Z" fill="#241240" stroke="#c07bff" stroke-opacity=".5" stroke-width="3"/>
    <path d="M-30,-70 C-62,-62 -70,-40 -60,-14" stroke="#241240" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M30,-70 C62,-60 74,-34 62,-8" stroke="#241240" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="-60" cy="-8" rx="6" ry="11" fill="${PAINT[2].hex}"/><ellipse cx="62" cy="-2" rx="6" ry="11" fill="${PAINT[10].hex}"/>
    <path d="M0,-138 q-6,-24 10,-34" stroke="#241240" stroke-width="5" fill="none"/><circle cx="12" cy="-172" r="6" fill="${PAINT[5].hex}"/>
    ${eye(0, -96, 20)}${eye(-18, -58, 7)}${eye(18, -58, 7)}
    <path d="M-14,-36 q14,12 28,0" stroke="#d8ff5a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g></svg>`;
  const C = () => `<svg viewBox="-60 -60 120 80" overflow="visible"><g class="cr-in">
    <path class="cr-body" d="M-44,10 C-50,-30 -20,-52 0,-52 C22,-52 50,-30 44,10Z" fill="#1c1033" stroke="#7b4fe0" stroke-opacity=".5" stroke-width="3"/>
    ${eye(-14, -26, 10)}${eye(14, -26, 10)}<path d="M-12,-4 q12,8 24,0" stroke="#d8ff5a" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>`;

  // ตำแหน่งตามระดับความใกล้ (0 = ไกล, 1 = ใกล้)  หน่วย vw / dvh
  const PATH = {
    a: L => ({ x: -9 + 30 * L, y: 15 - 3 * L, s: 0.78 + 0.5 * L, r: -8 + 6 * L }),
    b: L => ({ x: 98 - 30 * L, y: 21 - 3 * L, s: 0.7 + 0.55 * L, r: 7 - 5 * L }),
    c: L => ({ x: 40 + 6 * L, y: 6 + 3 * L, s: 0.35 + 0.4 * L, r: 0 })
  };

  function place(name, L, instant) {
    const d = list[name]; if (!d) return;
    const p = PATH[name](L);
    d.el.style.transition = instant ? 'none' : '';
    d.el.style.setProperty('--x', p.x + 'vw'); d.el.style.setProperty('--y', p.y + 'dvh');
    d.el.style.setProperty('--s', p.s); d.el.style.setProperty('--r', p.r + 'deg');
    d.el.style.opacity = d.vis ? 1 : 0;
  }
  return {
    init() {
      root = document.getElementById('creatures');
      root.innerHTML = '<div class="creature a">' + A() + '</div><div class="creature b">' + B() + '</div><div class="creature c">' + C() + '</div>';
      ['a', 'b', 'c'].forEach(n => { list[n] = { el: root.querySelector('.creature.' + n), vis: false }; });
      document.addEventListener('pointermove', e => {           // ตาของสิ่งมีชีวิตมองตามนิ้ว/เมาส์
        root.querySelectorAll('.pupil').forEach(p => {
          const r = p.getBoundingClientRect(); if (!r.width) return;
          const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), m = Math.hypot(dx, dy) || 1, k = Math.min(1, m / 200) * 4;
          p.style.transform = `translate(${(dx / m * k).toFixed(1)}px,${(dy / m * k).toFixed(1)}px)`;
        });
      }, { passive: true });
    },
    /** กำหนดว่าตัวไหนปรากฏ + ระดับความใกล้ */
    show(names, L, instant) {
      level = L == null ? level : L;
      Object.keys(list).forEach(n => { list[n].vis = names.includes(n); place(n, level, instant); });
    },
    hideAll() { Object.keys(list).forEach(n => { list[n].vis = false; list[n].el.style.opacity = 0; }); },
    setLevel(L) { level = TCE.clamp(L, 0, 1); Object.keys(list).forEach(n => place(n, level)); },
    get level() { return level; },
    /** ตกใจ: กระโดดเข้าใกล้ชั่วครู่ แล้วถอยกลับ */
    lunge() {
      Object.keys(list).forEach(n => { if (list[n].vis) { list[n].el.classList.remove('lunge'); void list[n].el.offsetWidth; list[n].el.classList.add('lunge'); } });
    },
    recoil() { Object.keys(list).forEach(n => { if (list[n].vis) { list[n].el.classList.remove('recoil'); void list[n].el.offsetWidth; list[n].el.classList.add('recoil'); } }); }
  };
})();

/* ---------------- ไฟ: กะพริบ / ดับ / แดง-น้ำเงิน ---------------- */
const Lights = (function () {
  let dark, rb, flickTimer = null;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  return {
    init() { dark = document.getElementById('dark'); rb = document.getElementById('redblue'); },
    level(o, ms) { dark.style.transitionDuration = (ms == null ? 400 : ms) + 'ms'; dark.style.opacity = o; },
    async flicker(n) {
      for (let i = 0; i < (n || 4); i++) { this.level(0.9, 0); await sleep(40 + Math.random() * 70); this.level(0.15, 0); await sleep(50 + Math.random() * 120); }
    },
    async blackout(ms) { Sfx.blackout(); this.level(1, 120); await sleep(ms || 1200); },
    on(ms) { this.level(0, ms == null ? 500 : ms); },
    startIdleFlicker() {                                   // ไฟกะพริบเป็นระยะ ๆ ระหว่างเล่น
      this.stopIdleFlicker();
      const loop = async () => { await this.flicker(2 + (Math.random() * 3 | 0)); this.level(0.12, 200); flickTimer = setTimeout(loop, 7000 + Math.random() * 9000); };
      flickTimer = setTimeout(loop, 4000);
    },
    stopIdleFlicker() { clearTimeout(flickTimer); flickTimer = null; },
    redblue(on) { rb.classList.toggle('on', !!on); }
  };
})();

/* ---------------- อนุภาคสี (confetti / สาดสี) ---------------- */
const Fx = (function () {
  let cv, cx, parts = [], raf = 0, dpr = 1;
  function size() { dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    parts.forEach(p => {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= p.drag; p.rot += p.vr; p.life--;
      cx.save(); cx.globalAlpha = Math.min(1, p.life / 20); cx.translate(p.x * dpr, p.y * dpr); cx.rotate(p.rot); cx.fillStyle = p.c;
      if (p.shape === 'rect') cx.fillRect(-p.r * dpr, -p.r * 0.5 * dpr, p.r * 2 * dpr, p.r * dpr);
      else { cx.beginPath(); cx.arc(0, 0, p.r * dpr, 0, 6.3); cx.fill(); }
      cx.restore();
    });
    raf = parts.length ? requestAnimationFrame(loop) : 0;
  }
  function add(list) { parts.push(...list); if (!raf) raf = requestAnimationFrame(loop); }
  const pal = () => TCE.Color.WHEEL.map(w => w.hex);
  return {
    init() { cv = document.getElementById('fx'); cx = cv.getContext('2d'); size(); addEventListener('resize', size); },
    /** สาดสีออกจากจุดหนึ่ง */
    burst(x, y, colors, n) {
      colors = colors && colors.length ? colors : pal(); const out = [];
      for (let i = 0; i < (n || 26); i++) {
        const a = Math.random() * 6.283, v = 2 + Math.random() * 6;
        out.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: 0.18, drag: 0.97, r: 3 + Math.random() * 6, c: colors[i % colors.length], life: 38 + Math.random() * 26, rot: 0, vr: 0, shape: 'dot' });
      }
      add(out);
    },
    confetti(ms) {
      const t0 = performance.now(), cols = pal();
      const spawn = () => {
        const out = [];
        for (let i = 0; i < 7; i++) out.push({ x: Math.random() * innerWidth, y: -10, vx: (Math.random() - .5) * 3, vy: 1 + Math.random() * 3, g: 0.05, drag: 0.995, r: 4 + Math.random() * 5, c: cols[Math.random() * cols.length | 0], life: 260, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, shape: Math.random() < .6 ? 'rect' : 'dot' });
        add(out);
        if (performance.now() - t0 < (ms || 3500)) setTimeout(spawn, 60);
      };
      spawn();
    },
    clear() { parts = []; }
  };
})();

function s1Mix() {

function s1Summary() {

      else { wheel.slots[o].classList.add('pulse'); fb('hint', 'คำใบ้ 2', 'วงกลมที่เต้นอยู่คือตำแหน่งของสีตรงข้าม'); }

        <div class="tray"><div class="warm"><div class="th">🔥 วรรณะร้อน</div><div class="chips" id="trW"></div></div><div class="cool"><div class="th">❄️ วรรณะเย็น</div><div class="chips" id="trC"></div></div></div>

    const wheel = buildWheel({ names: true }); $('#wk').appendChild(wheel.el);
    function ask() {
      rounds++; got = 0; need = Math.min(2, acceptable(grp).length);
      $('#tk').innerHTML = `แตะสี <b style="color:${grp === 'warm' ? '#ff9a5a' : '#7db4ff'}">วรรณะ${GN[grp]}</b> ${need} สี ${grp === 'warm' ? '🔥' : '❄️'}`;
      $('#sb').textContent = `โจทย์ที่ ${rounds} · จัดแล้ว ${12 - remaining.size}/12 สี`;
      $('#need').innerHTML = '<i></i>'.repeat(need);
      wheel.center(`<div class="center-card" style="font-size:1.4rem">${grp === 'warm' ? '🔥' : '❄️'}<br>${GN[grp]}<small>แตะ ${need} สี</small></div>`);
      setProg((12 - remaining.size) / 12);
    }

      grp = acceptable(opp).length ? opp : grp; ask();
    }
    async function finish() { busy = true; setProg(1); await sleep(900); resolve(); }
    wheel.slots.forEach(s => s.addEventListener('click', async () => {

      }

      s.classList.add('ok', place); s.classList.add('flag'); if (!w.borderline) s.classList.remove('flag');

    ask();

/* =====================================================================
   ด่านที่ 4 / โหมดแข่งขัน — THE FINAL MIX (ใช้ร่วมกัน)
   ===================================================================== */
const RYB = [{ k: 0, nm: 'แดง', hex: WHEEL[IDX.R].hex }, { k: 1, nm: 'เหลือง', hex: WHEEL[IDX.Y].hex }, { k: 2, nm: 'น้ำเงิน', hex: WHEEL[IDX.B].hex }];
const RING = 'conic-gradient(from -15deg,' + WHEEL.map((w, i) => `${w.hex} ${i * 30}deg ${(i + 1) * 30}deg`).join(',') + ')';
const rgbOf = v => C.rybToRgb(v[0], v[1], v[2]);

/** เล่น 1 รอบ → คืน {mix, sec, score, hints} (หรือ null ถ้าถูกยกเลิกกลางคัน) */
function playMixRound(r, targets, opt) {
  return new Promise(resolve => {
    const tv = targets[r], trgb = rgbOf(tv), thex = C.rgbToHex(trgb), mix = [0, 0, 0]; let hints = 0, t0 = performance.now(), iv = null, submitted = false;
    setPanel(`<div class="task">ผสมสีให้ตรงกับ <b>สีเป้าหมาย</b> <span class="pill">รอบ ${r + 1}/${targets.length}</span></div>
      <div class="timer-t"><span id="tm">⏱ 0.0 วิ</span><span>ยิ่งเร็ว คะแนนความเร็วยิ่งสูง</span></div><div class="timer"><i id="tbar"></i></div>
      <div class="cols two" style="margin-top:8px"><div class="work"><div class="mixwheel" style="--ring:${RING};--tc:${thex};--mc:#ffffff"><div class="in"><div class="t"></div><div class="m"></div></div></div><div class="mix-labels"><span>◀ เป้าหมาย</span><span>ของคุณ ▶</span></div></div>
      <div class="work">${RYB.map(c => `<div class="chan" style="--c:${c.hex}"><div class="rr"><span class="nm"><i></i>${c.nm}</span><button class="step" data-k="${c.k}" data-d="-5" aria-label="ลด${c.nm}">−</button><input type="range" min="0" max="100" step="5" value="0" data-k="${c.k}" aria-label="${c.nm}"><button class="step" data-k="${c.k}" data-d="5" aria-label="เพิ่ม${c.nm}">+</button><span class="v" id="v${c.k}">0%</span></div></div>`).join('')}
        <div class="actions" style="width:100%">${opt.hint ? '<button class="btn ghost sm" id="hintBtn">💡 คำใบ้</button>' : ''}<button class="btn green big" id="submit" style="flex:1">SUBMIT ✔</button></div></div></div><div class="fb" id="fb"></div>`, true);
    const mw = $('.mixwheel'), refresh = () => {
      mw.style.setProperty('--mc', C.rgbToHex(rgbOf(mix)));
      mix.forEach((v, k) => { $('#v' + k).textContent = v + '%'; $('input[data-k="' + k + '"]').value = v; });
    };
    $$('input[type=range]').forEach(inp => inp.addEventListener('input', () => { mix[+inp.dataset.k] = +inp.value; refresh(); }));
    $$('.step').forEach(b => b.addEventListener('click', () => { const k = +b.dataset.k; mix[k] = Math.max(0, Math.min(100, mix[k] + +b.dataset.d)); Sfx.pick(); refresh(); }));
    const tick = () => {
      const s = (performance.now() - t0) / 1000; $('#tm').textContent = `⏱ ${s.toFixed(1)} วิ`;
      $('#tbar').style.setProperty('--t', Math.max(0, Math.min(1, (C.TIME_ZERO - s) / (C.TIME_ZERO - C.TIME_FULL))).toFixed(3));
    };
    iv = setInterval(tick, 100); tick();
    G.abortRound = () => { if (submitted) return; submitted = true; clearInterval(iv); resolve(null); };
    if (opt.hint) $('#hintBtn').onclick = () => {
      hints++; const mx = tv.indexOf(Math.max(...tv)), names = ['แดง', 'เหลือง', 'น้ำเงิน'];
      if (hints === 1) fb('hint', 'คำใบ้ (หักคะแนนเล็กน้อย)', `สีเป้าหมายมี <b>${names[mx]}</b> มากที่สุด`);
      else fb('hint', 'คำใบ้ 2 (หักคะแนนเล็กน้อย)', 'สัดส่วนโดยประมาณ: ' + tv.map((v, k) => `<b>${names[k]}</b> ≈ ${Math.round(v / 25) * 25}%`).join(' · '));
    };
    $('#submit').onclick = () => {
      if (submitted) return; submitted = true; clearInterval(iv); Sfx.good();
      const sec = (performance.now() - t0) / 1000, score = C.scoreRound(trgb, rgbOf(mix), sec), pen = Math.min(score.total, hints * 8);
      G.abortRound = null; resolve({ mix: mix.slice(), sec, score, hints, pen, total: score.total - pen });
    };
  });
}

function recipeHtml(v, label) {

  const nm = ['แดง', 'เหลือง', 'น้ำเงิน'], d = mv.map((v, k) => v - tv[k]), k = d.map(Math.abs).indexOf(Math.max(...d.map(Math.abs)));
  if (Math.abs(d[k]) <= 10) return 'สัดส่วนแม่สีของคุณใกล้เคียงเป้าหมายมาก!';

/** แสดงผลรอบ + รอกดต่อ */
function showMixResult(r, targets, res, opt) {
  return new Promise(resolve => {
    const tv = targets[r], s = res.score, last = r === targets.length - 1;
    const verdict = s.pct >= 0.9 ? 'แม่นยำมาก! 🎯' : s.pct >= 0.6 ? 'ใกล้เคียงแล้ว 👍' : 'ยังห่างอยู่ ลองอีกครั้งในรอบหน้า';
    setPanel(`<div class="result"><div class="bigtitle">รอบที่ ${r + 1}/${targets.length} · ${verdict}</div>
      <div class="pts" id="pts">0<small> / 100</small></div>
      <div class="cmp" style="--tc:${C.rgbToHex(rgbOf(tv))};--mc:${C.rgbToHex(rgbOf(res.mix))}"><div class="t"><span>เป้าหมาย</span></div><div class="m"><span>ของคุณ</span></div></div>
      <div class="bars"><div class="b"><span>ความใกล้เคียง</span><div class="track"><i style="width:${s.closePts / 70 * 100}%"></i></div><span>${s.closePts}/70</span></div>
      <div class="b"><span>ความเร็ว (${res.sec.toFixed(1)} วิ)</span><div class="track"><i style="width:${s.timePts / 30 * 100}%"></i></div><span>${s.timePts}/30</span></div>
      ${res.pen ? `<div class="b"><span>คำใบ้</span><div class="track"></div><span>−${res.pen}</span></div>` : ''}</div>
      <div class="recipe">${recipeHtml(tv, 'สูตรเป้าหมาย')}${recipeHtml(res.mix, 'สูตรของคุณ')}</div>
      <div class="fb"><div class="card info"><div class="ico">📖</div><div><div class="tt">เรียนรู้จากรอบนี้</div><div class="tx">${tipFor(tv, res.mix)}<br><span class="mini-r">ระบบผสมสีแบบ RYB: ยิ่งใส่แม่สีหลายสี สีจะยิ่งหม่นลง และถ้าครบทั้ง 3 สีมาก ๆ จะใกล้สีน้ำตาลเข้ม</span></div></div></div></div>
      <div class="actions"><button class="btn big" id="nx">${last ? 'ดูผลรวม ▶' : 'รอบต่อไป ▶'}</button></div></div>`, true);
    let n = 0; const target = res.total, iv = setInterval(() => { n = Math.min(target, n + Math.max(1, Math.ceil(target / 24))); $('#pts').firstChild.textContent = n; if (n >= target) clearInterval(iv); }, 30);
    if (s.pct >= 0.6) { Sfx.good(); Fx.confetti(1200); }

  });
}

/** วนเล่นทุกรอบ — opt: {startRound, hint, onRound(r,res)} */
async function mixRounds(targets, opt) {
  for (let r = opt.startRound || 0; r < targets.length; r++) {
    const res = await playMixRound(r, targets, opt);
    if (!res) return false;
    await opt.onRound(r, res);
    await showMixResult(r, targets, res, opt);
  }
  return true;
}

function newPlayerNode(name) { return { name, score: 0, totalTime: 0, round: 0, finished: false, joinedAt: Date.now(), lastSeen: Date.now() }; }

async function mpCreate(name) {
  const net = getNet(); let code = null;
  for (let i = 0; i < 8; i++) { const c = TCE.Room.newCode(); if (!(await net.get('rooms/' + c))) { code = c; break; } }
  if (!code) throw new Error('สร้างรหัสห้องไม่สำเร็จ ลองใหม่อีกครั้ง');
  MP.code = code; MP.id = TCE.Room.newId(); MP.name = name; MP.host = true;
  await net.set('rooms/' + code, { host: MP.id, status: 'lobby', seed: 0, createdAt: Date.now(), players: { [MP.id]: newPlayerNode(name) } });
  enterRoom();
}
async function mpJoin(code, name) {
  const net = getNet(), room = await net.get('rooms/' + code);
  if (!room) throw new Error('ไม่พบห้องรหัส ' + code + (usingFirebase() ? '' : ' (โหมดจำลอง: ต้องเปิดในเบราว์เซอร์เดียวกับเจ้าของห้อง)'));
  const saved = MP.savedSession(), players = room.players || {};
  if (saved && saved.code === code && players[saved.id]) { MP.id = saved.id; MP.name = players[saved.id].name; MP.host = room.host === saved.id; }
  else {
    if (room.status !== 'lobby') throw new Error('การแข่งขันในห้องนี้เริ่มไปแล้ว');
    if (Object.keys(players).length >= 60) throw new Error('ห้องเต็มแล้ว (สูงสุด 60 คน)');
    let n = name, k = 2; const names = new Set(Object.values(players).map(p => p.name));
    while (names.has(n)) n = name.slice(0, 12) + k++;
    MP.id = TCE.Room.newId(); MP.name = n; MP.host = false;
    await net.set(`rooms/${code}/players/${MP.id}`, newPlayerNode(n));
  }
  MP.code = code; enterRoom();
}
function enterRoom() {
  G.mode = 'mp'; MP.phase = 'none'; MP.running = false; MP.celebrated = false; MP.lobbyBuilt = false; MP.saveSession();
  history.replaceState(null, '', location.pathname);    // ล้าง ?room= ออกจาก URL

}
async function mpLeave(confirmFirst) {
  const go = async () => {

    try { if (MP.code) { if (MP.host && MP.phase === 'lobby') await net.set('rooms/' + MP.code, null); else if (MP.room && MP.room.players && MP.room.players[MP.id] && MP.phase === 'lobby') await net.set(`rooms/${MP.code}/players/${MP.id}`, null); } } catch (e) {}

/* ---------- สถานะห้อง (real-time) ---------- */
function onRoom(r) {
  MP.room = r;
  if (!r) { if (MP.phase !== 'none') { toast('ห้องถูกปิดแล้ว'); sessionStorage.removeItem('tce_mp'); setTimeout(() => location.href = location.pathname, 1200); } return; }
  if (!r.players || !r.players[MP.id]) { if (r.status === 'lobby') getNet().set(`rooms/${MP.code}/players/${MP.id}`, newPlayerNode(MP.name)); return; }
  MP.host = r.host === MP.id;
  const st = r.status;
  if (st === 'lobby') {
    if (MP.phase !== 'lobby') { if (MP.abortRound) {} G.abortRound && G.abortRound(); MP.phase = 'lobby'; MP.running = false; MP.celebrated = false; MP.lobbyBuilt = false; Creatures.hideAll(); Lights.stopIdleFlicker(); G.hudOff = true; Scene.setStage(1); Lights.level(0.25, 600); buildLobby(); }
    renderLobby();
  } else if (st === 'playing') {
    if (MP.phase === 'lobby' || MP.phase === 'none') runCompetition();
    else if (MP.phase === 'play') updateRankChip();
    else if (MP.phase === 'board') renderBoard();
  } else if (st === 'finished') {
    if (MP.phase === 'play') { G.abortRound && G.abortRound(); }
    else if (MP.phase === 'board') renderBoard();
    else if (MP.phase === 'lobby' || MP.phase === 'none') { MP.phase = 'board'; showBoard(); }
  }
  if (MP.host && st === 'playing' && TCE.Room.allFinished(r.players)) getNet().set(`rooms/${MP.code}/status`, 'finished');
}

    try { create ? await mpCreate(name) : await mpJoin(code, name); }
    catch (e) { err(e.message || 'เชื่อมต่อไม่สำเร็จ'); btn.disabled = false; btn.textContent = create ? '👥 สร้างห้อง' : '🚪 เข้าร่วมห้อง'; }
  };
  $('#jGo').onclick = go; $('#jName').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#jBack').onclick = () => { if (presetCode && !create) { showJoinScreen('join'); } else location.href = location.pathname; };
}
function mpStartCreate(story) { MP.story = story === true; Sfx.stopClock(); showJoinScreen('create'); }

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  Scene.init(); Creatures.init(); Lights.init(); Fx.init();
  $('#verTag').textContent = 'v1.0';
  document.addEventListener('pointerdown', () => Sfx.init(), { passive: true });
  $('#btnSound').textContent = Sfx.muted ? '🔇' : '🔊';
  $('#btnSound').onclick = () => { Sfx.init(); Sfx.setMuted(!Sfx.muted); $('#btnSound').textContent = Sfx.muted ? '🔇' : '🔊'; };
  $('#btnMenu').onclick = openMenu; $('#cutSkip').onclick = () => Cut.doSkip(); $('#cutView').addEventListener('click', () => { if (!$('#cutSkip').hidden) Cut.doSkip(); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  const q = new URLSearchParams(location.search), fbParam = q.get('fb'), room = TCE.Room.normalizeCode(q.get('room'));
  if (fbParam && /^https:\/\//.test(fbParam)) lsSet('tce_fb', fbParam.replace(/\/+$/, ''));
  if (room.length === 4) { Lights.level(0.3, 0); Scene.setStage(1); showJoinScreen('join', room); return; }     // เข้าผ่าน QR → ไปหน้าเข้าร่วมห้องทันที

  $('#scr-gate').addEventListener('click', () => { Sfx.init(); intro(); }, { once: true });
  $('#btnStart').onclick = () => { Sfx.init(); if (loadSave() && !confirm('มีความคืบหน้าที่บันทึกไว้ — เริ่มใหม่จะล้างข้อมูลเดิม ต้องการเริ่มใหม่หรือไม่?')) return; startNew(); };
  $('#btnContinue').onclick = () => { Sfx.init(); continueGame(); };
  $('#btnResetSave').onclick = () => modal('<h3>ล้างความคืบหน้า?</h3><p>คะแนนและด่านที่ผ่านแล้วจะถูกลบ</p>', [{ label: 'ล้างข้อมูล', cls: 'red', fn: resetGame }, { label: 'ยกเลิก' }]);
  $('#btnCreate').onclick = () => { Sfx.init(); mpStartCreate(); };
  $('#btnJoin').onclick = () => { Sfx.init(); Sfx.stopClock(); showJoinScreen('join'); };
  $('#btnRejoin').onclick = async () => {
    const s = MP.savedSession(); if (!s) return; Sfx.init(); Sfx.stopClock();
    try { const r = await getNet().get('rooms/' + s.code); if (!r || !r.players || !r.players[s.id]) { sessionStorage.removeItem('tce_mp'); toast('ห้องเดิมไม่อยู่แล้ว'); $('#btnRejoin').hidden = true; return; } MP.code = s.code; MP.id = s.id; MP.name = s.name; MP.host = s.host; enterRoom(); }
    catch (e) { toast('เชื่อมต่อไม่สำเร็จ'); }
  };
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
